services:
  - type: web
    name: strawberry-server
    runtime: node
    repo: https://github.com/gbruins/strawberry-server
    branch: master
    region: oregon
    plan: starter
    buildCommand: npm ci
    preDeployCommand: npm run knex:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      # Number of proxies in front of the app; confirm on the live site (spec 001 T056)
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Production Supabase project — a SEPARATE Supabase project from local dev's, set once
      # in the Render dashboard (specs/004-multi-tenant-supabase).
      #
      # MUST be Supabase's Supavisor SESSION pooler host (Dashboard → Connect → "Session
      # pooler"), NOT the direct connection (db.<project-ref>.supabase.co) and NOT the
      # transaction-mode pooler on port 6543. Render has no outbound IPv6, and the direct
      # host is IPv6-only unless Supabase's paid IPv4 add-on is enabled — using it here fails
      # the build with `getaddrinfo ENOTFOUND db.<project-ref>.supabase.co`. Session mode
      # (port 5432, on the pooler host) is IPv4-reachable and still preserves per-connection
      # session state, which this app needs for SET LOCAL (RLS tenant-scoping) and
      # LISTEN/NOTIFY — transaction mode does not.
      #   SUPABASE_DB_HOST = aws-0-<region>.pooler.supabase.com
      #   SUPABASE_DB_USER = postgres.<project-ref>   (note the project-ref suffix)
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      # Project Settings -> API -> JWT Settings -> "Legacy JWT Secret" (NOT the service_role
      # key). Used to self-sign short-lived Supabase Realtime tokens for clients with no GoTrue
      # session (e.g. kitchen stations, which log in by PIN). Missing this degrades Realtime
      # features to polling rather than erroring — e.g. strawberry-admin's kitchen board shows
      # "Live updates unavailable — refreshing automatically" instead of failing outright.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Restricted app role (NOT postgres) — RLS is silently bypassed by the owner/superuser
      # connection otherwise (research.md #3 addendum). Same role name as local dev's.
      #
      # Through the session pooler above, this value must ALSO carry the project-ref suffix —
      # e.g. "strawberry_app.<project-ref>" — same convention as SUPABASE_DB_USER. The role
      # itself is still created in SQL without the suffix (`CREATE ROLE strawberry_app LOGIN
      # PASSWORD '...'`); the suffix is only how Supavisor routes the connection. Migrations
      # that GRANT/REVOKE to this role strip the suffix back off before using it in SQL
      # (strawberry-server/server/db/migrations/96_multi_tenant_foundation.js).
      - key: SUPABASE_APP_DB_USER
        sync: false
      - key: SUPABASE_APP_DB_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Requires Stripe Tax to be activated and an origin address registered in the
      # Stripe Dashboard first, or automatic_tax silently calculates nothing (see
      # strawberry-server/README.md and CheckoutService.js's use of this flag).
      - key: STRIPE_AUTOMATIC_TAX
        value: "true"
      - key: STOREFRONT_URL
        sync: false
      # Comma-separated allowed origins, NO quotes and NO trailing slashes (Render's env var
      # field stores exactly what you type — quoting it produces the literal string '"value"',
      # which matches no real browser Origin header). Also can't be "*": server/index.js sets
      # `credentials: true` on CORS, and the spec forbids combining that with a wildcard origin
      # — browsers reject it outright regardless of server config. Must list every origin that
      # calls this API from a browser (admin UI + storefront), e.g.:
      #   https://strawberry-admin.onrender.com,https://sellout-storefront.onrender.com
      # Add the real storefront domain here too once DNS is live (https://www.selloutpizza.com),
      # alongside the onrender.com one rather than replacing it.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: sellout-storefront
    runtime: static
    repo: https://github.com/gbruins/sellout
    branch: main
    buildCommand: npm ci && npm run build-only
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      # Basic-auth username — arbitrary, never checked against any specific value server-side
      # (strawberry-server/server/plugins/auth/AuthService.js apiKeyIsValid only requires it be
      # non-empty; HTTP Basic auth just needs both halves present). The API key alone (below)
      # is what actually resolves the tenant. "store" is just a label, not a real credential.
      - key: VITE_API_USER
        value: store
      - key: VITE_API_KEY
        sync: false

  - type: web
    name: strawberry-admin
    runtime: static
    repo: https://github.com/gbruins/strawberry-admin
    branch: main
    buildCommand: npm ci && npm run build-only
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        sync: false
      # Production Supabase project (same project as strawberry-server's SUPABASE_* above)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
